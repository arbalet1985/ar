<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌍 Выбор координат для астрономии</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: var(--tg-color-bg, #000);
            color: var(--tg-color-text, #fff);
            transition: all 0.3s ease;
        }
        #map {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
        .controls {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--tg-color-secondary-bg, rgba(255,255,255,0.9));
            backdrop-filter: blur(20px);
            padding: 10px 12px;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35);
            width: max-content;
            max-width: 92%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .coordinates {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            white-space: pre-line;
            background: rgba(0,0,0,0.1);
            padding: 7px 9px;
            border-radius: 9px;
        }
        .status {
            font-size: 11px;
            opacity: 0.75;
            margin-bottom: 7px;
        }
        button {
            background: var(--tg-color-primary, #0088cc);
            color: var(--tg-color-button-text, #fff);
            border: none;
            padding: 10px 18px;
            border-radius: 11px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,136,204,0.4);
        }
        /* Телефоны: панель ещё компактнее, чтобы не закрывать карту */
        @media (max-width: 480px) {
            .controls { bottom: 8px; padding: 8px 10px; border-radius: 12px; }
            .coordinates { font-size: 12px; padding: 6px 8px; margin-bottom: 6px; }
            .status { font-size: 10px; margin-bottom: 5px; }
            button { padding: 9px 14px; font-size: 13px; }
        }
        button:hover:not(:disabled) {
            background: var(--tg-color-primary, #0077b3);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,136,204,0.5);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        button:disabled {
            background: var(--tg-color-disabled, #ccc);
            cursor: not-allowed;
            opacity: 0.6;
        }
        .leaflet-container {
            font-family: inherit;
        }
        .leaflet-control-zoom {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            background: var(--tg-color-secondary-bg, #fff);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <div class="status" id="status">Загрузка карты...</div>
        <div class="coordinates" id="coords">👆 Нажмите на карте для выбора точки наблюдения</div>
        <button onclick="sendLocation()" id="sendBtn" disabled>📍 Отправить координаты боту</button>
    </div>

    <script>
        let map, marker, selectedLat = 57.6260, selectedLng = 60.1002; // Екатеринбург по умолчанию
        const tg = window.Telegram?.WebApp;

        // Инициализация Telegram WebApp
        if (tg) {
            tg.ready();
            tg.expand();
            tg.MainButton.setText('📍 Отправить координаты').show().onClick(sendLocation);
            console.log('✅ Telegram WebApp v' + tg.version);
            document.getElementById('status').textContent = '🌟 Telegram WebApp готов';
        } else {
            document.getElementById('status').textContent = '🌐 Обычный браузер';
        }

        // Инициализация карты
        map = L.map('map', {
            zoomControl: true,
            scrollWheelZoom: 'center',
            doubleClickZoom: true,
            boxZoom: true,
            keyboard: true,
            dragging: true,
            zoomAnimation: true
        }).setView([selectedLat, selectedLng], 12);

        // ✅ CartoDB Positron - РАБОТАЕТ В TELEGRAM!
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Кастомный маркер (SVG base64 - НЕ БЛОКИРУЕТСЯ)
        const redIcon = L.divIcon({
            className: 'custom-marker',
            html: `
                <svg width="30" height="42" viewBox="0 0 30 42" style="filter: drop-shadow(0 2px 8px rgba(255,0,0,0.6))">
                    <path d="M15 0C6.7 0 0 6.7 0 15c0 13 15 27 15 27s15-14 15-27C30 6.7 23.3 0 15 0z" fill="#ff4444"/>
                    <circle cx="15" cy="15" r="7" fill="white"/>
                    <circle cx="15" cy="15" r="5" fill="#ff4444"/>
                </svg>
            `,
            iconSize: [30, 42],
            iconAnchor: [15, 42],
            popupAnchor: [0, -40]
        });

        // Клик по карте
        map.on('click', function(e) {
            selectedLat = e.latlng.lat.toFixed(6);
            selectedLng = e.latlng.lng.toFixed(6);
            
            // Удаляем старый маркер
            if (marker) map.removeLayer(marker);
            
            // Новый маркер с popup
            marker = L.marker([selectedLat, selectedLng], { icon: redIcon }).addTo(map);
            marker.bindPopup(`
                <b>📍 Точка наблюдения</b><br>
                Широта: ${selectedLat}<br>
                Долгота: ${selectedLng}<br>
                <small>Идеально для астрономии! 🌌</small>
            `).openPopup();
            
            // Центрируем карту
            map.setView([selectedLat, selectedLng], 16, {
                animate: true,
                duration: 0.5
            });
            
            // Обновляем UI
            document.getElementById('coords').textContent = 
                `🌟 Широта: ${selectedLat}°\n⭐ Долгота: ${selectedLng}°`;
            document.getElementById('sendBtn').disabled = false;
            
            if (tg) tg.MainButton.setParams({ text: '🚀 Отправить в бот' });
            
            console.log('📍 Выбраны координаты:', selectedLat, selectedLng);
        });

        // Отправка координат
        function sendLocation() {
            if (!selectedLat || !selectedLng) {
                alert('👆 Сначала выберите точку на карте!');
                return;
            }
            
            const data = { lat: parseFloat(selectedLat), lon: parseFloat(selectedLng) };
            const dataStr = JSON.stringify(data);
            
            console.log('🚀 Отправка в бот:', dataStr);
            
            // Отправка возможна только внутри Telegram через sendData.
            if (tg?.sendData) {
                tg.sendData(dataStr);
                tg.close();
                return;
            }

            // Вне Telegram (обычный браузер) бот не получит данные — буфер обмена
            // не помогает (у бота нет приёма вставленного текста), поэтому
            // просто подсказываем открыть карту из Telegram.
            alert('⚠️ Откройте карту через кнопку «Выбрать на карте» в Telegram, чтобы отправить координаты боту.');
        }

        // Автоопределение местоположения
        if (navigator.geolocation && !tg) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    selectedLat = position.coords.latitude.toFixed(6);
                    selectedLng = position.coords.longitude.toFixed(6);
                    map.setView([selectedLat, selectedLng], 15);
                    
                    marker = L.marker([selectedLat, selectedLng], { icon: redIcon }).addTo(map);
                    marker.bindPopup(`
                        <b>📍 Ваше местоположение</b><br>
                        Широта: ${selectedLat}<br>
                        Долгота: ${selectedLng}
                    `).openPopup();
                    
                    document.getElementById('coords').textContent = 
                        `🌟 Широта: ${selectedLat}°\n⭐ Долгота: ${selectedLng}°`;
                    document.getElementById('sendBtn').disabled = false;
                },
                function() {
                    document.getElementById('status').textContent = '🗺️ Используйте Екатеринбург';
                }
            );
        }

        // Адаптация под тему Telegram
        if (tg?.colorScheme === 'dark') {
            document.body.style.background = '#1a1a1a';
            document.querySelector('.controls').style.background = 'rgba(30,30,30,0.95)';
        }

        console.log('🌟 Астрономическая карта загружена!');
        document.getElementById('status').textContent = '🌌 Готово! Выберите точку наблюдения';
    </script>
</body>
</html>
